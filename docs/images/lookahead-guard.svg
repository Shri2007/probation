<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#f8fafc"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#172033">The lookahead guard: the agent only ever sees the past</text>

  <!-- future zone -->
  <rect x="550" y="70" width="320" height="140" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="710" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">FUTURE: raises LookaheadError</text>
  <!-- past bracket -->
  <path d="M60 84 V78 H520 V84" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="290" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">visible through the DataHandle</text>

  <!-- bars -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="110" width="60" height="70" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="90" y="200" fill="#172033">t−4</text>
    <rect x="160" y="110" width="60" height="70" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="190" y="200" fill="#172033">t−3</text>
    <rect x="260" y="110" width="60" height="70" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="290" y="200" fill="#172033">t−2</text>
    <rect x="360" y="110" width="60" height="70" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="390" y="200" fill="#172033">t−1</text>
    <rect x="460" y="110" width="60" height="70" rx="6" fill="#86efac" stroke="#15803d" stroke-width="2.5"/>
    <text x="490" y="200" font-weight="700" fill="#172033">t (today)</text>
    <rect x="580" y="110" width="60" height="70" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="610" y="150" font-size="20" fill="#94a3b8">?</text>
    <text x="610" y="200" fill="#5b6475">t+1</text>
    <rect x="680" y="110" width="60" height="70" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="710" y="150" font-size="20" fill="#94a3b8">?</text>
    <text x="710" y="200" fill="#5b6475">t+2</text>
    <rect x="780" y="110" width="60" height="70" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="810" y="150" font-size="20" fill="#94a3b8">?</text>
    <text x="810" y="200" fill="#5b6475">t+3</text>
  </g>

  <!-- clock -->
  <line x1="535" y1="60" x2="535" y2="215" stroke="#172033" stroke-width="2.5"/>
  <text x="535" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#172033">engine clock</text>

  <!-- calls -->
  <rect x="30" y="250" width="840" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="276" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#15803d">data.history("AAA", 5)              → bars t−4 … t</text>
  <text x="50" y="300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b91c1c">data.history("AAA", 1, end=t+1)     → LookaheadError (never clipped, never empty)</text>
</svg>
