<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="410" fill="#f8fafc"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#172033">One trading day inside the engine</text>

  <!-- connectors first -->
  <path d="M220 215 H246" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440 215 H466" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M660 215 H686" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M785 270 V345 H125 V274" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#5b6475">next trading day</text>
  <path d="M565 270 C565 300, 345 300, 345 274" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="455" y="314" text-anchor="middle" font-size="12" fill="#b45309">orders wait for tomorrow's open</text>

  <!-- event queue -->
  <rect x="30" y="60" width="850" height="64" rx="10" fill="#99f6e4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="455" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">One event queue, popped strictly in time order</text>
  <text x="455" y="108" text-anchor="middle" font-size="12" fill="#172033">same-timestamp ties: FILL before MARKET before ORDER, then first-in-first-out</text>
  <path d="M455 124 V156" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- steps -->
  <rect x="30" y="160" width="190" height="110" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="125" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6475">1</text>
  <text x="125" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">Bar opens</text>
  <text x="125" y="240" text-anchor="middle" font-size="12" fill="#5b6475">clock advances to day t</text>

  <rect x="250" y="160" width="190" height="110" rx="10" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
  <text x="345" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">2</text>
  <text x="345" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">Fill pending orders</text>
  <text x="345" y="240" text-anchor="middle" font-size="12" fill="#5b6475">at today's open,</text>
  <text x="345" y="256" text-anchor="middle" font-size="12" fill="#5b6475">+ slippage + commission</text>

  <rect x="470" y="160" width="190" height="110" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="565" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">3</text>
  <text x="565" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">Strategy decides</text>
  <text x="565" y="240" text-anchor="middle" font-size="12" fill="#5b6475">reads bars up to t only,</text>
  <text x="565" y="256" text-anchor="middle" font-size="12" fill="#5b6475">returns orders dated t</text>

  <rect x="690" y="160" width="190" height="110" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="785" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">4</text>
  <text x="785" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">Mark to market</text>
  <text x="785" y="240" text-anchor="middle" font-size="12" fill="#5b6475">value at close, append</text>
  <text x="785" y="256" text-anchor="middle" font-size="12" fill="#5b6475">to the equity curve</text>

  <text x="30" y="385" font-size="12" fill="#5b6475">Fills are applied before the strategy runs, so the agent always sees its real cash and positions. A fill that would overspend or short raises and aborts the run.</text>
</svg>
